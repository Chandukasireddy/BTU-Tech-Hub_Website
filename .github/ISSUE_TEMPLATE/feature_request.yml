name: ✨ Feature Request
description: Suggest a new feature or improvement for the community or website
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your idea and help us grow the BTU Tech Spark community! 💡
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need or the situation you're in.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Website / UI
        - Accessibility
        - Meetups & events
        - Projects showcase
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I'm willing to help build this feature
