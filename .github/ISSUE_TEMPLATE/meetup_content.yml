name: 📝 Meetup Content
description: Share notes, resources, or photos from a Sunday meetup
title: "[Meetup]: "
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: Thank you for documenting our Sunday Ritual! Content can also be added directly via a pull request.
  - type: input
    id: meetup
    attributes:
      label: Meetup number or date
      placeholder: "e.g. meetup-28 or 2026-11-01"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary, takeaways, or resources
      description: What was discussed, presented, or shared?
  - type: textarea
    id: links
    attributes:
      label: Links to slides, repos, or photos
  - type: checkboxes
    id: permission
    attributes:
      label: Permissions
      options:
        - label: I confirm that I'm allowed to share this content and that any photos show people who agreed to be photographed
          required: true
